<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados — Dra. Mariana Leite</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sand:    #f5f2ee;
      --white:   #ffffff;
      --border:  #e8e4de;
      --text:    #1e1e1e;
      --muted:   #888480;
      --gold:    #b89a6e;
      --sage:    #6a9478;
      --tag-bg:  #f0ece6;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--sand);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto 3px 36px;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 48px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .clinic-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    .tagline {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Slideshow area ── */
    #slideshow {
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 56px 20px;
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Photo ── */
    .photo-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrap img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      background: var(--border);
    }

    /* ── Meta info ── */
    .meta {
      margin-top: 18px;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    .meta-tags {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tag {
      background: var(--tag-bg);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.78rem;
      color: #555;
      border: 1px solid var(--border);
    }

    .tag strong { color: var(--text); font-weight: 600; }

    .queixa {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }

    .protocolo {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    /* ── Progress bar ── */
    #progress-bar {
      background: var(--border);
    }

    #progress-fill {
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--sage));
      width: 0%;
    }

    /* ── Dots ── */
    #dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--white);
      border-top: 1px solid var(--border);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.35s, transform 0.35s;
    }

    .dot.active {
      background: var(--gold);
      transform: scale(1.4);
    }

    /* ── Loading / error ── */
    #status-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <span class="clinic-name">Dra. Mariana Leite</span>
    <span class="tagline">Resultados reais &middot; Transformações verdadeiras</span>
  </header>

  <div id="slideshow">
    <div id="status-msg">Carregando casos&hellip;</div>
  </div>

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <div id="dots"></div>

</div>

<!--
  Coloque o arquivo de música em: recepcao/music/ambiente.mp3
  Qualquer MP3 royalty-free de spa/ambiente funciona.
-->
<audio id="bgMusic" loop>
  <source src="music/ambiente.mp3" type="audio/mpeg">
</audio>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIGURAÇÃO  —  edite SOMENTE estas três linhas
// ═══════════════════════════════════════════════════════

//  1. URL CSV da sua planilha do Google Sheets
//     Planilha → Arquivo → Compartilhar → Publicar na web → CSV → Copiar link
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdnAuvcKiaqtCDTQ-Llbo97-IhVdkyugbdsxMz8gYkeJWh_8-7LX-Bocbb0o2fnbTGIwBBU7m5XQ_o/pub?gid=0&single=true&output=csv';

//  2. Segundos que cada slide fica na tela
const SLIDE_SECONDS = 12;

//  3. Intervalo para buscar novos casos (em minutos)
const REFRESH_MINUTES = 15;

// ═══════════════════════════════════════════════════════
//  Estrutura esperada da planilha (linha 1 = cabeçalho):
//  A: Idade  |  B: Queixa principal  |  C: Protocolo
//  D: URL Foto Antes (Google Drive)  |  E: URL Foto Depois
//  F: Ativo (TRUE / FALSE — deixe FALSE para ocultar)
// ═══════════════════════════════════════════════════════

let slides = [], current = 0, autoTimer = null;
const SLIDE_MS = SLIDE_SECONDS * 1000;

// Converte link de compartilhamento do Drive em link de imagem direta
function driveImg(url) {
  if (!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : url;
}

// Parse de CSV simples (lida com vírgulas dentro de aspas)
function parseCSV(raw) {
  const rows = [];
  const lines = raw.trim().split(/\r?\n/).slice(1); // pula cabeçalho
  for (const line of lines) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

function buildSlides(rows) {
  const data = rows
    .filter(r => (r[4] || 'TRUE').toUpperCase() !== 'FALSE' && r[3])
    .map(r => ({
      idade:     r[0] || '—',
      queixa:    r[1] || '',
      protocolo: r[2] || '',
      imagem:    driveImg(r[3])
    }));

  if (!data.length) return false;

  const ss   = document.getElementById('slideshow');
  const dots = document.getElementById('dots');

  ss.querySelectorAll('.slide').forEach(el => el.remove());
  dots.innerHTML = '';

  data.forEach((caso, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.innerHTML = `
      <div class="photo-wrap">
        <img src="${caso.imagem}" alt="${caso.queixa}">
      </div>
      <div class="meta">
        <div class="meta-tags">
          <span class="tag"><strong>Idade:</strong> ${caso.idade} anos</span>
          <span class="tag"><strong>Protocolo:</strong> ${caso.protocolo}</span>
        </div>
        <div class="queixa">${caso.queixa}</div>
      </div>`;
    ss.appendChild(div);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dots.appendChild(dot);
  });

  slides = data;
  return true;
}

function goTo(idx) {
  const allSlides = document.querySelectorAll('.slide');
  const allDots   = document.querySelectorAll('.dot');
  if (!allSlides.length) return;

  allSlides[current]?.classList.remove('active');
  allDots[current]?.classList.remove('active');

  current = ((idx % slides.length) + slides.length) % slides.length;

  allSlides[current]?.classList.add('active');
  allDots[current]?.classList.add('active');

  animateProgress();
}

function animateProgress() {
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${SLIDE_MS}ms linear`;
    fill.style.width = '100%';
  }));
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => goTo(current + 1), SLIDE_MS);
}

function tryMusic() {
  const audio = document.getElementById('bgMusic');
  audio.volume = 0.3;
  const play = () => audio.play().catch(() => {});
  play();
  // Smart TVs às vezes bloqueiam autoplay — tenta no primeiro toque
  document.addEventListener('click', play, { once: true });
}

async function loadData() {
  if (SHEET_CSV_URL === 'COLE_AQUI_A_URL_DO_CSV') {
    document.getElementById('status-msg').textContent =
      'Configure a URL da planilha no topo do arquivo index.html';
    return;
  }

  try {
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    const rows  = parseCSV(text);
    const ok    = buildSlides(rows);

    if (ok) {
      const msg = document.getElementById('status-msg');
      if (msg) msg.remove();
      current = 0;
      startAuto();
      animateProgress();
      tryMusic();
    } else {
      document.getElementById('status-msg').textContent =
        'Nenhum caso ativo na planilha ainda.';
    }
  } catch (e) {
    console.error('Erro ao carregar planilha:', e);
    document.getElementById('status-msg').textContent =
      'Erro ao buscar dados. Verifique se a planilha está publicada.';
  }
}

loadData();
setInterval(loadData, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
