<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meraki — Resultados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --olive-dark:   #4C4B0A;
      --olive-mid:    #766C34;
      --gold:         #DBBD74;
      --offwhite:     #F3EFE8;
      --beige:        #C8C4C2;
      --bg:           #F3EFE8;
      --border:       #C8C4C2;
      --border-light: #E0DDD8;
      --text:         #2A2A1A;
      --muted:        #766C34;
      --tag-bg:       #EDEAE3;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Jost', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto 3px clamp(36px, 4vh, 48px);
      height: 100vh;
    }

    /* ══════════════════════════════
       HEADER — Identidade Meraki
    ══════════════════════════════ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(32px, 4vw, 72px);
      height: clamp(68px, 7.5vh, 88px);
      background: var(--olive-dark);
      position: relative;
      flex-shrink: 0;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 30%, var(--gold) 70%, transparent 100%);
      opacity: 0.4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Monograma "M" estilizado */
    .brand-monogram {
      width: clamp(40px, 4.5vh, 54px);
      height: clamp(40px, 4.5vh, 54px);
      border: 1.5px solid rgba(219,189,116,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .brand-monogram::before {
      content: 'M';
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.5rem, 2.2vh, 2rem);
      font-weight: 300;
      color: var(--gold);
      letter-spacing: 0;
      line-height: 1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.9rem, 2.8vh, 3rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--offwhite);
      line-height: 1;
    }

    .brand-sub {
      font-size: clamp(0.75rem, 1.1vh, 1rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }

    .brand-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1rem, 1.5vh, 1.4rem);
      font-weight: 300;
      font-style: italic;
      color: var(--beige);
      letter-spacing: 0.04em;
      opacity: 0.75;
    }

    /* ══════════════════════════════
       SLIDESHOW
    ══════════════════════════════ */
    #slideshow {
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    /* Layout horizontal: foto esquerda | info direita */
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: row;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Coluna esquerda: foto ── */
    .photo-col {
      flex: 0 0 63%;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      position: relative;
    }

    .photo-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Coluna direita: informações ── */
    .info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(24px, 4vw, 64px) clamp(28px, 3.5vw, 60px);
      border-left: 1px solid var(--border-light);
      background: var(--bg);
      position: relative;
    }

    /* Linha ornamental vertical à esquerda do painel */
    .info-col::before {
      content: '';
      position: absolute;
      left: 0; top: 10%; bottom: 10%;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
      opacity: 0.5;
    }

    /* ── Nome do profissional ── */
    .prof-banner {
      margin-bottom: clamp(20px, 3vh, 40px);
    }

    .prof-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.6rem, 3vh, 2.8rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--olive-dark);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .prof-specialty {
      font-size: clamp(0.8rem, 1.3vh, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--olive-mid);
      margin-top: clamp(4px, 0.6vh, 8px);
    }

    /* ── Divisor ornamental ── */
    .meta-ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 180px;
      margin-bottom: clamp(16px, 2.5vh, 32px);
    }

    .meta-ornament::before {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .meta-ornament-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── Tags ── */
    .meta-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: clamp(12px, 1.8vh, 24px);
    }

    .tag {
      background: var(--tag-bg);
      border-radius: 2px;
      padding: clamp(5px, 0.7vh, 9px) clamp(14px, 1.5vw, 22px);
      font-size: clamp(0.8rem, 1.3vh, 1.1rem);
      color: var(--olive-mid);
      border: 1px solid var(--border-light);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tag strong {
      color: var(--olive-dark);
      font-weight: 600;
    }

    /* ── Queixa ── */
    .queixa {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.4rem, 2.6vh, 2.4rem);
      font-style: italic;
      color: var(--olive-dark);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }

    /* ── Progress bar ── */
    #progress-bar {
      background: rgba(76,75,10,0.12);
    }

    #progress-fill {
      height: 3px;
      background: linear-gradient(90deg, var(--olive-mid), var(--gold));
      width: 0%;
    }

    /* ── Dots ── */
    #dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1vw, 14px);
      background: var(--olive-dark);
      border-top: 1px solid rgba(219,189,116,0.2);
    }

    .dot {
      width: clamp(5px, 0.6vw, 8px);
      height: clamp(5px, 0.6vw, 8px);
      border-radius: 50%;
      background: rgba(243,239,232,0.25);
      transition: background 0.35s, transform 0.35s;
    }

    .dot.active {
      background: var(--gold);
      transform: scale(1.5);
    }

    /* ── Botão de música ── */
    #music-btn {
      position: fixed;
      bottom: clamp(48px, 5.5vh, 60px);
      right: clamp(16px, 2vw, 28px);
      width: clamp(36px, 4vh, 48px);
      height: clamp(36px, 4vh, 48px);
      border-radius: 50%;
      background: var(--olive-dark);
      border: 1px solid rgba(219,189,116,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 200;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0.55;
    }

    #music-btn:hover { opacity: 1; transform: scale(1.1); }

    #music-btn svg {
      width: 15px;
      height: 15px;
      fill: var(--gold);
      flex-shrink: 0;
    }

    #music-btn.playing  { opacity: 0.9; }
    #music-btn.muted svg.icon-on  { display: none; }
    #music-btn.muted svg.icon-off { display: block; }
    #music-btn svg.icon-off { display: none; }

    /* Mini-player flutuante */
    #music-player {
      position: fixed;
      bottom: 96px;
      right: 16px;
      width: 300px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      z-index: 199;
      display: none;
      background: #000;
    }

    #music-player.open { display: block; }

    #music-player iframe {
      display: block;
      width: 100%;
      border: none;
    }

    #music-player-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: var(--gold);
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 3px;
      z-index: 1;
    }

    /* ── Loading / error ── */
    #status-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-monogram"></div>
      <div class="brand-text">
        <span class="brand-name">Meraki</span>
        <span class="brand-sub">Clínica de Estética</span>
      </div>
    </div>
    <span class="brand-tagline">Estética que cura, preserva e eleva.</span>
  </header>

  <div id="slideshow">
    <div id="status-msg">Carregando casos&hellip;</div>
  </div>

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <div id="dots"></div>

</div>

<!-- Áudio local (fallback quando MUSIC_URL está vazio) -->
<audio id="bgMusic" loop>
  <source src="music/ambiente.mp3" type="audio/mpeg">
</audio>

<!-- Mini-player flutuante (YouTube ou Spotify) -->
<div id="music-player">
  <button id="music-player-close">FECHAR ✕</button>
</div>

<!-- Botão flutuante -->
<button id="music-btn" title="Música" aria-label="Música">
  <svg class="icon-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 18l1.73 1.73L21 18.46 5.54 3 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
</button>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO  —  edite SOMENTE estas linhas
// ═══════════════════════════════════════════════════════════════════

const SHEET_CSV_URL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdnAuvcKiaqtCDTQ-Llbo97-IhVdkyugbdsxMz8gYkeJWh_8-7LX-Bocbb0o2fnbTGIwBBU7m5XQ_o/pub?gid=0&single=true&output=csv';
const SLIDE_SECONDS   = 12;
const REFRESH_MINUTES = 15;

//  MÚSICA
//  ─────────────────────────────────────────────────────────────────
//  OPÇÃO 1 — YouTube (recomendado para TV, toca completo sem login)
//    Cole a URL de qualquer playlist ou vídeo do YouTube
//    Exemplo: 'https://www.youtube.com/playlist?list=PLxxxxxx'
//
//  OPÇÃO 2 — Spotify (requer Spotify Premium logado no navegador)
//    Sem Premium, o embed toca apenas 30s de prévia por música.
//    Para usar: faça login no Spotify no Chrome da clínica, depois abra este site.
//    Exemplo: 'https://open.spotify.com/playlist/3URC3Tf5YIpFpVf6emmDMB'
//
//  OPÇÃO 3 — MP3 local: deixe vazio '' (arquivo em music/ambiente.mp3)
//  ─────────────────────────────────────────────────────────────────
const MUSIC_URL = 'https://open.spotify.com/playlist/3URC3Tf5YIpFpVf6emmDMB';

// ═══════════════════════════════════════════════════════════════════
//  ESTRUTURA DA PLANILHA (linha 1 = cabeçalho):
//  A: Profissional  |  B: Idade  |  C: Queixa principal
//  D: Protocolo     |  E: URL da Montagem (Drive)
//  F: Ativo (TRUE / FALSE — FALSE oculta o caso)
// ═══════════════════════════════════════════════════════════════════

const ESPECIALIDADES = {
  'dra. mariana leite': 'Biomédica Esteta',
  'dra. bruna noriega': 'Biomédica Esteta',
  'tatieli araujo':     'Esteticista',
  'tatieli araújo':     'Esteticista',
};

function getEspecialidade(nome) {
  const key = nome.toLowerCase().trim().replace(/\./g, '').replace(/\s+/g, ' ');
  for (const [k, v] of Object.entries(ESPECIALIDADES)) {
    if (key.includes(k.replace(/\./g, '').replace(/\s+/g, ' '))) return v;
  }
  return 'Profissional';
}

// ─────────────────────────────────────────────
let slides = [], current = 0, autoTimer = null;
const SLIDE_MS = SLIDE_SECONDS * 1000;

function driveImg(url) {
  if (!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : url;
}

function parseCSV(raw) {
  const rows = [];
  const lines = raw.trim().split(/\r?\n/).slice(1);
  for (const line of lines) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

function buildSlides(rows) {
  const data = rows
    .filter(r => (r[5] || 'TRUE').toUpperCase() !== 'FALSE' && r[4])
    .map(r => ({
      profissional:  r[0] || '',
      especialidade: getEspecialidade(r[0] || ''),
      idade:         r[1] || '—',
      queixa:        r[2] || '',
      protocolo:     r[3] || '',
      montagem:      driveImg(r[4]),
    }));

  if (!data.length) return false;

  const ss   = document.getElementById('slideshow');
  const dots = document.getElementById('dots');
  ss.querySelectorAll('.slide').forEach(el => el.remove());
  dots.innerHTML = '';

  data.forEach((caso, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.innerHTML = `
      <div class="photo-col">
        <img src="${caso.montagem}" alt="${caso.queixa}">
      </div>
      <div class="info-col">
        <div class="prof-banner">
          <div class="prof-name">${caso.profissional}</div>
          <div class="prof-specialty">${caso.especialidade}</div>
        </div>
        <div class="meta-ornament"><div class="meta-ornament-diamond"></div></div>
        <div class="meta-tags">
          <span class="tag"><strong>Idade:</strong> ${caso.idade} anos</span>
          <span class="tag"><strong>Protocolo:</strong> ${caso.protocolo}</span>
        </div>
        <div class="queixa">${caso.queixa}</div>
      </div>`;
    ss.appendChild(div);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dots.appendChild(dot);
  });

  slides = data;
  return true;
}

function goTo(idx) {
  const allSlides = document.querySelectorAll('.slide');
  const allDots   = document.querySelectorAll('.dot');
  if (!allSlides.length) return;
  allSlides[current]?.classList.remove('active');
  allDots[current]?.classList.remove('active');
  current = ((idx % slides.length) + slides.length) % slides.length;
  allSlides[current]?.classList.add('active');
  allDots[current]?.classList.add('active');
  animateProgress();
}

function animateProgress() {
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${SLIDE_MS}ms linear`;
    fill.style.width = '100%';
  }));
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => goTo(current + 1), SLIDE_MS);
}

function buildEmbedUrl(url) {
  if (!url) return null;

  // YouTube
  const ytList  = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
  const ytVideo = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    const base   = ytVideo ? `https://www.youtube.com/embed/${ytVideo[1]}` : 'https://www.youtube.com/embed/';
    const params = new URLSearchParams({ autoplay: '1', loop: '1', controls: '1', modestbranding: '1' });
    if (ytList) { params.set('list', ytList[1]); params.set('listType', 'playlist'); }
    return { url: base + '?' + params, height: 200, type: 'youtube' };
  }

  // Spotify
  const sp = url.match(/spotify\.com\/(playlist|album|track)\/([a-zA-Z0-9]+)/);
  if (sp) {
    return {
      url: `https://open.spotify.com/embed/${sp[1]}/${sp[2]}?utm_source=oembed&theme=0`,
      height: 152,
      type: 'spotify'
    };
  }

  return null;
}

function tryMusic() {
  const btn    = document.getElementById('music-btn');
  const player = document.getElementById('music-player');
  const audio  = document.getElementById('bgMusic');
  const closeB = document.getElementById('music-player-close');

  const embed = buildEmbedUrl(MUSIC_URL);

  if (embed) {
    // Cria iframe dentro do mini-player
    const iframe = document.createElement('iframe');
    iframe.src   = embed.url;
    iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
    iframe.setAttribute('allowfullscreen', '');
    iframe.style.cssText = `height:${embed.height}px;`;
    player.appendChild(iframe);

    // Botão abre/fecha o player
    btn.addEventListener('click', () => {
      const isOpen = player.classList.toggle('open');
      btn.classList.toggle('playing', isOpen);
    });

    closeB.addEventListener('click', (e) => {
      e.stopPropagation();
      player.classList.remove('open');
      btn.classList.remove('playing');
    });

  } else {
    // Fallback MP3 local
    audio.volume = 0.3;
    const play = () => audio.play().catch(() => {});
    play();
    document.addEventListener('click', play, { once: true });

    let muted = false;
    btn.addEventListener('click', () => {
      muted = !muted;
      btn.classList.toggle('muted', muted);
      muted ? audio.pause() : audio.play().catch(() => {});
    });

    // Esconde botão "fechar" no modo MP3
    closeB.style.display = 'none';
  }
}

async function loadData() {
  try {
    const res  = await fetch(SHEET_CSV_URL + '&_=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const ok   = buildSlides(rows);
    if (ok) {
      const msg = document.getElementById('status-msg');
      if (msg) msg.remove();
      current = 0;
      startAuto();
      animateProgress();
      tryMusic();
    } else {
      document.getElementById('status-msg').textContent =
        'Nenhum caso ativo na planilha ainda.';
    }
  } catch (e) {
    console.error('Erro ao carregar planilha:', e);
    document.getElementById('status-msg').textContent =
      'Erro ao buscar dados. Verifique se a planilha está publicada.';
  }
}

loadData();
setInterval(loadData, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
