<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meraki — Resultados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --olive-dark:   #4C4B0A;
      --olive-mid:    #766C34;
      --gold:         #DBBD74;
      --offwhite:     #F3EFE8;
      --beige:        #C8C4C2;
      --bg:           #F3EFE8;
      --border:       #C8C4C2;
      --border-light: #E0DDD8;
      --text:         #2A2A1A;
      --muted:        #766C34;
      --tag-bg:       #EDEAE3;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Jost', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto 3px 40px;
      height: 100vh;
    }

    /* ══════════════════════════════
       HEADER — Identidade Meraki
    ══════════════════════════════ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 56px;
      height: 72px;
      background: var(--olive-dark);
      position: relative;
      flex-shrink: 0;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 30%, var(--gold) 70%, transparent 100%);
      opacity: 0.4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Monograma "M" estilizado */
    .brand-monogram {
      width: 42px;
      height: 42px;
      border: 1.5px solid rgba(219,189,116,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .brand-monogram::before {
      content: 'M';
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--gold);
      letter-spacing: 0;
      line-height: 1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--offwhite);
      line-height: 1;
    }

    .brand-sub {
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }

    .brand-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 300;
      font-style: italic;
      color: var(--beige);
      letter-spacing: 0.04em;
      opacity: 0.75;
    }

    /* ══════════════════════════════
       SLIDESHOW
    ══════════════════════════════ */
    #slideshow {
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Badge do profissional ── */
    .prof-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px 32px 8px;
      flex-shrink: 0;
    }

    .prof-line {
      flex: 1;
      max-width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--olive-mid));
    }

    .prof-line.right {
      background: linear-gradient(90deg, var(--olive-mid), transparent);
    }

    .prof-info {
      text-align: center;
    }

    .prof-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--olive-dark);
      text-transform: uppercase;
    }

    .prof-specialty {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--olive-mid);
      margin-top: 1px;
    }

    /* ── Foto (montagem antes/depois) ── */
    .photo-wrap {
      flex: 1;
      min-height: 0;
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrap img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      display: block;
      box-shadow: 0 4px 32px rgba(76,75,10,0.10), 0 1px 4px rgba(76,75,10,0.06);
    }

    /* ── Meta info ── */
    .meta {
      text-align: center;
      padding: 10px 48px 14px;
      flex-shrink: 0;
    }

    .meta-ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 140px;
      margin: 0 auto 10px;
    }

    .meta-ornament::before,
    .meta-ornament::after {
      content: '';
      flex: 1;
      height: 1px;
    }

    .meta-ornament::before {
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .meta-ornament::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .meta-ornament-diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .meta-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .tag {
      background: var(--tag-bg);
      border-radius: 2px;
      padding: 4px 14px;
      font-size: 0.7rem;
      color: var(--olive-mid);
      border: 1px solid var(--border-light);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tag strong {
      color: var(--olive-dark);
      font-weight: 600;
    }

    .queixa {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--olive-dark);
      letter-spacing: 0.02em;
    }

    /* ── Progress bar ── */
    #progress-bar {
      background: rgba(76,75,10,0.12);
    }

    #progress-fill {
      height: 3px;
      background: linear-gradient(90deg, var(--olive-mid), var(--gold));
      width: 0%;
    }

    /* ── Dots ── */
    #dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--olive-dark);
      border-top: 1px solid rgba(219,189,116,0.2);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(243,239,232,0.25);
      transition: background 0.35s, transform 0.35s;
    }

    .dot.active {
      background: var(--gold);
      transform: scale(1.5);
    }

    /* ── Loading / error ── */
    #status-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-monogram"></div>
      <div class="brand-text">
        <span class="brand-name">Meraki</span>
        <span class="brand-sub">Clínica de Estética</span>
      </div>
    </div>
    <span class="brand-tagline">Beleza que cura, preserva e eleva.</span>
  </header>

  <div id="slideshow">
    <div id="status-msg">Carregando casos&hellip;</div>
  </div>

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <div id="dots"></div>

</div>

<audio id="bgMusic" loop>
  <source src="music/ambiente.mp3" type="audio/mpeg">
</audio>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO  —  edite SOMENTE estas linhas
// ═══════════════════════════════════════════════════════════════════

const SHEET_CSV_URL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdnAuvcKiaqtCDTQ-Llbo97-IhVdkyugbdsxMz8gYkeJWh_8-7LX-Bocbb0o2fnbTGIwBBU7m5XQ_o/pub?gid=0&single=true&output=csv';
const SLIDE_SECONDS   = 12;
const REFRESH_MINUTES = 15;

// ═══════════════════════════════════════════════════════════════════
//  ESTRUTURA DA PLANILHA (linha 1 = cabeçalho):
//  A: Profissional  |  B: Idade  |  C: Queixa principal
//  D: Protocolo     |  E: URL da Montagem (Drive)
//  F: Ativo (TRUE / FALSE — FALSE oculta o caso)
// ═══════════════════════════════════════════════════════════════════

const ESPECIALIDADES = {
  'dra. mariana leite': 'Biomédica Esteta',
  'dra. bruna noriega': 'Biomédica Esteta',
  'tatieli araujo':     'Esteticista',
  'tatieli araújo':     'Esteticista',
};

function getEspecialidade(nome) {
  const key = nome.toLowerCase().trim().replace(/\./g, '').replace(/\s+/g, ' ');
  for (const [k, v] of Object.entries(ESPECIALIDADES)) {
    if (key.includes(k.replace(/\./g, '').replace(/\s+/g, ' '))) return v;
  }
  return 'Profissional';
}

// ─────────────────────────────────────────────
let slides = [], current = 0, autoTimer = null;
const SLIDE_MS = SLIDE_SECONDS * 1000;

function driveImg(url) {
  if (!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : url;
}

function parseCSV(raw) {
  const rows = [];
  const lines = raw.trim().split(/\r?\n/).slice(1);
  for (const line of lines) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

function buildSlides(rows) {
  const data = rows
    .filter(r => (r[5] || 'TRUE').toUpperCase() !== 'FALSE' && r[4])
    .map(r => ({
      profissional:  r[0] || '',
      especialidade: getEspecialidade(r[0] || ''),
      idade:         r[1] || '—',
      queixa:        r[2] || '',
      protocolo:     r[3] || '',
      montagem:      driveImg(r[4]),
    }));

  if (!data.length) return false;

  const ss   = document.getElementById('slideshow');
  const dots = document.getElementById('dots');
  ss.querySelectorAll('.slide').forEach(el => el.remove());
  dots.innerHTML = '';

  data.forEach((caso, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.innerHTML = `
      <div class="prof-banner">
        <div class="prof-line"></div>
        <div class="prof-info">
          <div class="prof-name">${caso.profissional}</div>
          <div class="prof-specialty">${caso.especialidade}</div>
        </div>
        <div class="prof-line right"></div>
      </div>
      <div class="photo-wrap">
        <img src="${caso.montagem}" alt="${caso.queixa}">
      </div>
      <div class="meta">
        <div class="meta-ornament"><div class="meta-ornament-diamond"></div></div>
        <div class="meta-tags">
          <span class="tag"><strong>Idade:</strong> ${caso.idade} anos</span>
          <span class="tag"><strong>Protocolo:</strong> ${caso.protocolo}</span>
        </div>
        <div class="queixa">${caso.queixa}</div>
      </div>`;
    ss.appendChild(div);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dots.appendChild(dot);
  });

  slides = data;
  return true;
}

function goTo(idx) {
  const allSlides = document.querySelectorAll('.slide');
  const allDots   = document.querySelectorAll('.dot');
  if (!allSlides.length) return;
  allSlides[current]?.classList.remove('active');
  allDots[current]?.classList.remove('active');
  current = ((idx % slides.length) + slides.length) % slides.length;
  allSlides[current]?.classList.add('active');
  allDots[current]?.classList.add('active');
  animateProgress();
}

function animateProgress() {
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${SLIDE_MS}ms linear`;
    fill.style.width = '100%';
  }));
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => goTo(current + 1), SLIDE_MS);
}

function tryMusic() {
  const audio = document.getElementById('bgMusic');
  audio.volume = 0.3;
  const play = () => audio.play().catch(() => {});
  play();
  document.addEventListener('click', play, { once: true });
}

async function loadData() {
  try {
    const res  = await fetch(SHEET_CSV_URL + '&_=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const ok   = buildSlides(rows);
    if (ok) {
      const msg = document.getElementById('status-msg');
      if (msg) msg.remove();
      current = 0;
      startAuto();
      animateProgress();
      tryMusic();
    } else {
      document.getElementById('status-msg').textContent =
        'Nenhum caso ativo na planilha ainda.';
    }
  } catch (e) {
    console.error('Erro ao carregar planilha:', e);
    document.getElementById('status-msg').textContent =
      'Erro ao buscar dados. Verifique se a planilha está publicada.';
  }
}

loadData();
setInterval(loadData, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
